<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090d16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>登录 · TTSNover 阅读器</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body.auth-page {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 20px;
    background: #090d16;
    background-image: radial-gradient(circle at 50% 15%, #18233c 0%, #090d16 80%);
    overflow-y: auto;
  }
  .auth-ambient-glow {
    position: fixed;
    top: 15%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 380px;
    height: 380px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(59, 130, 246, 0.16) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  .auth-card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 410px;
    padding: 36px 30px 28px;
    border-radius: 24px;
    background: rgba(17, 24, 39, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 24px 60px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    animation: authCardIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes authCardIn {
    from { transform: translateY(24px) scale(0.97); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }
  .auth-header {
    text-align: center;
    margin-bottom: 24px;
  }
  .auth-brand-badge {
    width: 52px;
    height: 52px;
    border-radius: 16px;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35);
    margin-bottom: 12px;
  }
  .auth-brand-badge svg {
    width: 26px;
    height: 26px;
  }
  .auth-title {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.02em;
    color: #f1f5f9;
  }
  .auth-sub {
    font-size: 13px;
    color: #94a3b8;
    margin: 0;
    line-height: 1.5;
  }
  
  /* 现代分段切换胶囊 */
  .auth-tabs {
    display: flex;
    background: rgba(0, 0, 0, 0.3);
    padding: 4px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    margin-bottom: 22px;
    position: relative;
  }
  .auth-tab-btn {
    flex: 1;
    border: 0;
    background: transparent;
    color: #94a3b8;
    font-size: 14px;
    font-weight: 500;
    padding: 10px 0;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
    z-index: 2;
  }
  .auth-tab-btn:hover {
    color: #f1f5f9;
  }
  .auth-tab-btn.on {
    color: #fff;
    font-weight: 600;
    background: rgba(255, 255, 255, 0.12);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
  }

  /* 输入框与前后缀图标 */
  .auth-field {
    margin-bottom: 16px;
    text-align: left;
  }
  .auth-field label {
    display: block;
    font-size: 12.5px;
    font-weight: 500;
    color: #94a3b8;
    margin-bottom: 6px;
  }
  .auth-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .auth-input-icon {
    position: absolute;
    left: 14px;
    color: #64748b;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .auth-input-wrap input {
    width: 100%;
    padding: 12px 42px 12px 40px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(0, 0, 0, 0.25);
    color: #f1f5f9;
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
    transition: all 0.18s ease;
  }
  .auth-input-wrap input:focus {
    border-color: #3b82f6;
    background: rgba(0, 0, 0, 0.4);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
  }
  .auth-input-wrap input::placeholder {
    color: #475569;
    font-size: 13.5px;
  }
  .auth-pw-toggle {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    color: #64748b;
    padding: 4px;
    cursor: pointer;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.15s ease;
  }
  .auth-pw-toggle:hover {
    color: #cbd5e1;
  }

  /* 提交按钮 */
  .auth-submit-btn {
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: #fff;
    margin-top: 8px;
    box-shadow: 0 6px 20px rgba(59, 130, 246, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .auth-submit-btn:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(59, 130, 246, 0.45);
  }
  .auth-submit-btn:active {
    transform: scale(0.98);
  }
  .auth-submit-btn:disabled {
    opacity: 0.65;
    cursor: not-allowed;
    transform: none;
  }

  /* 反馈消息与特性徽章 */
  .auth-msg {
    min-height: 20px;
    font-size: 13px;
    margin: 14px 0 6px;
    line-height: 1.5;
    border-radius: 8px;
    padding: 6px 12px;
    display: none;
    text-align: center;
  }
  .auth-msg.show {
    display: block;
  }
  .auth-msg.err {
    background: rgba(239, 68, 68, 0.15);
    color: #f87171;
    border: 1px solid rgba(239, 68, 68, 0.3);
  }
  .auth-msg.ok {
    background: rgba(16, 185, 129, 0.15);
    color: #4ade80;
    border: 1px solid rgba(16, 185, 129, 0.3);
  }

  .auth-features-row {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .auth-feat-item {
    text-align: center;
  }
  .auth-feat-icon {
    font-size: 16px;
    margin-bottom: 4px;
    display: block;
  }
  .auth-feat-text {
    font-size: 11px;
    color: #64748b;
    line-height: 1.3;
    display: block;
  }
</style>
</head>
<body data-theme="dark" class="auth-page">

<div class="auth-ambient-glow"></div>

<form class="auth-card" id="authForm" autocomplete="on">
  <div class="auth-header">
    <div class="auth-brand-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
      </svg>
    </div>
    <h1 class="auth-title">TTSNover</h1>
    <p class="auth-sub" id="authSub">登录后继续阅读你的私密书架</p>
  </div>

  <div class="auth-tabs">
    <button type="button" id="tabLogin" class="auth-tab-btn on">账号登录</button>
    <button type="button" id="tabRegister" class="auth-tab-btn">开放注册</button>
  </div>

  <div class="auth-field">
    <label for="username">用户名</label>
    <div class="auth-input-wrap">
      <span class="auth-input-icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </span>
      <input id="username" name="username" type="text" autocomplete="username"
             placeholder="2–32 位，支持中文、字母、数字" required autofocus>
    </div>
  </div>

  <div class="auth-field">
    <label for="password">密码</label>
    <div class="auth-input-wrap">
      <span class="auth-input-icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </span>
      <input id="password" name="password" type="password" autocomplete="current-password"
             placeholder="密码长度至少 8 位" required>
      <button type="button" class="auth-pw-toggle" id="btnTogglePw" title="显示/隐藏密码">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="iconEye">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>
  </div>

  <button class="auth-submit-btn" id="authSubmit" type="submit">
    <span id="btnSubmitText">进入书架</span>
  </button>
  
  <div class="auth-msg" id="authMsg"></div>

  <div class="auth-features-row">
    <div class="auth-feat-item">
      <span class="auth-feat-icon">🔒</span>
      <span class="auth-feat-text">独立私密书架</span>
    </div>
    <div class="auth-feat-item">
      <span class="auth-feat-icon">⚡</span>
      <span class="auth-feat-text">多源并发搜书</span>
    </div>
    <div class="auth-feat-item">
      <span class="auth-feat-icon">🎙️</span>
      <span class="auth-feat-text">端对端加密 Key</span>
    </div>
  </div>
</form>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const next = params.get('next') || '/';
  let mode = 'login';

  const $ = (s) => document.querySelector(s);
  const msg = $('#authMsg');
  const pwInput = $('#password');
  const btnTogglePw = $('#btnTogglePw');
  const btnSubmitText = $('#btnSubmitText');

  // 密码显隐切换
  btnTogglePw.onclick = () => {
    const isPw = pwInput.type === 'password';
    pwInput.type = isPw ? 'text' : 'password';
    btnTogglePw.innerHTML = isPw
      ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>`
      : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>`;
  };

  function setMode(m) {
    mode = m;
    const login = m === 'login';
    $('#tabLogin').classList.toggle('on', login);
    $('#tabRegister').classList.toggle('on', !login);
    btnSubmitText.textContent = login ? '进入书架' : '注册并登录';
    $('#authSub').textContent = login ? '登录后继续阅读你的私密书架' : '开放注册：每人一套独立书架与书源';
    pwInput.setAttribute('autocomplete', login ? 'current-password' : 'new-password');
    msg.textContent = '';
    msg.className = 'auth-msg';
  }

  $('#tabLogin').onclick = () => setMode('login');
  $('#tabRegister').onclick = () => setMode('register');

  function say(text, kind) {
    msg.textContent = text;
    msg.className = 'auth-msg show ' + (kind || '');
  }

  $('#authForm').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const username = $('#username').value.trim();
    const password = pwInput.value;
    if (!username || !password) return say('用户名和密码不能为空', 'err');
    if (password.length < 8) return say('密码长度不能少于 8 位', 'err');

    const btn = $('#authSubmit');
    btn.disabled = true;
    btnSubmitText.textContent = '正在验证…';

    try {
      const r = await fetch('/api/auth/' + (mode === 'login' ? 'login' : 'register'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) {
        say(j.error || ('登录失败：HTTP ' + r.status), 'err');
        btn.disabled = false;
        btnSubmitText.textContent = mode === 'login' ? '进入书架' : '注册并登录';
        return;
      }
      const c = j.claimed || null;
      if (c && (c.books || c.sources)) {
        say(`✓ 注册成功！已自动接管原数据（${c.books || 0} 本书、${c.sources || 0} 个书源），正在进入…`, 'ok');
      } else {
        say('✓ 验证成功，正在进入书架…', 'ok');
      }
      setTimeout(() => location.replace(next), 400);
    } catch (e) {
      say('网络异常：' + e.message, 'err');
      btn.disabled = false;
      btnSubmitText.textContent = mode === 'login' ? '进入书架' : '注册并登录';
    }
  });

  // 已登录直接跳转
  fetch('/api/auth/me', { headers: { 'Accept': 'application/json' } })
    .then((r) => (r.ok ? r.json() : null))
    .then((j) => { if (j && j.user) location.replace(next); })
    .catch(() => {});
})();
</script>
</body>
</html>
